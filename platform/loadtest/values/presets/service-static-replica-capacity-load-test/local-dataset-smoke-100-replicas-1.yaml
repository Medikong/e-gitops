schemaVersion: dropmong.loadtest.preset/v1
preset:
  name: local-dataset-smoke-100-replicas-1
  scenario: service-static-replica-capacity-load-test
  dataset: { profile: smoke-100 }
  deployment: { replicas: 1 }
  execution:
    warmupSeconds: 5
    measureSeconds: 10
    confirmationMeasureSeconds: 5
    cooldownSeconds: 2
    repetitions: 1
    searchTolerance: 0.5
    maxSearchTrials: 1
    independentTrials: true
    serviceConcurrency: 1
    backlogStability: { consecutiveChecks: 3, checkIntervalSeconds: 5, timeoutSeconds: 120, maxKafkaLagGrowth: 0, requireNoPendingPods: true }
  capacity:
    default: { startRps: 1, maxRps: 1 }
