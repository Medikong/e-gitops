schemaVersion: dropmong.loadtest.dataset/v1
dataset:
  profile: smoke-1day
  seed: "20260724"
  revision: smoke-1day-v1
  parameters:
    version: 1
    as_of: "2026-07-24T00:00:00Z"
    days: 1
    initial_users: 64
    daily_new_users: 1
    daily_drops: 4
    products_per_drop: 2
    raw_view_hours: 1
    active_inventory_per_product: 8
    paymentReadyOrderCount: 32
    couponClaimHeadroom: 32
    couponCodeCount: 32
    fixturePoolSize: 64
    fixtureTrialCount: 1
    tiers:
      - name: general
        share_percent: 50
        views_per_drop: 30
        interest_rate_percent: 20
        buyer_conversion_percent: 10
        orders_per_buyer: 1
      - name: planned
        share_percent: 30
        views_per_drop: 40
        interest_rate_percent: 20
        buyer_conversion_percent: 10
        orders_per_buyer: 1
      - name: event
        share_percent: 20
        views_per_drop: 50
        interest_rate_percent: 20
        buyer_conversion_percent: 10
        orders_per_buyer: 1
    daily_coupon_campaigns: 1
    seasonal_coupon_campaigns: 1
    daily_coupon_issues: 16
    event_coupon_issues: 16
    coupon_redemption_percent: 30
    notifications_per_order: 2
    agreements: [terms-of-service:v1, privacy-policy:v1]
  fixtureManifest: fixture-manifest.json
  fixturePools:
    auth-service: [authUsers]
    user-service: [profileRead, profileWrite]
    catalog-service: [drops]
    coupon-service: [couponWallet, couponClaim, couponRedeem]
    interest-service: [existingInterests, interestAdd, viewEvents]
    order-service: [orderCreate, orderRead, orderCancel]
    payment-service: [paymentReady, paymentRead]
    notification-service: [notificationRead, notificationEvents]
    dropmong-web: [webProducts, webCheckouts]
  writeFixturePolicy:
    strategy: reseed-before-each-independent-trial
    reuseOnExhaustion: false
    allocation: endpoint-weighted-disjoint-ranges
