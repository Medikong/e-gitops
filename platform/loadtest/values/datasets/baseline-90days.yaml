schemaVersion: dropmong.loadtest.dataset/v1
dataset:
  profile: baseline-90days
  seed: "20260723"
  revision: baseline-90days-v1
  parameters:
    version: 1
    as_of: "2026-07-23T00:00:00Z"
    days: 90
    initial_users: 10000
    daily_new_users: 500
    daily_drops: 6
    products_per_drop: 12
    raw_view_hours: 6
    active_inventory_per_product: 1000
    paymentReadyOrderCount: 10000
    couponClaimHeadroom: 6000
    couponCodeCount: 6000
    fixturePoolSize: 10000
    fixtureTrialCount: 12
    tiers:
      - name: general
        share_percent: 70
        views_per_drop: 700
        interest_rate_percent: 8
        buyer_conversion_percent: 5
        orders_per_buyer: 1.2
      - name: planned
        share_percent: 25
        views_per_drop: 1500
        interest_rate_percent: 12
        buyer_conversion_percent: 10
        orders_per_buyer: 1.2
      - name: event
        share_percent: 5
        views_per_drop: 3000
        interest_rate_percent: 18
        buyer_conversion_percent: 18
        orders_per_buyer: 1.2
    daily_coupon_campaigns: 2
    seasonal_coupon_campaigns: 20
    daily_coupon_issues: 1600
    event_coupon_issues: 6000
    coupon_redemption_percent: 30
    notifications_per_order: 4
    agreements: [terms-of-service:v1, privacy-policy:v1]
  fixtureManifest: fixture-manifest.json
  fixturePools:
    auth-service: [authUsers]
    user-service: [profileRead, profileWrite]
    catalog-service: [drops]
    coupon-service: [couponWallet, couponClaim, couponRedeem]
    interest-service: [existingInterests, interestAdd, viewEvents]
    order-service: [orderCreate, orderRead, orderCancel]
    payment-service: [paymentReady, paymentRead]
    notification-service: [notificationRead, notificationEvents]
    dropmong-web: [webProducts, webCheckouts]
  writeFixturePolicy:
    strategy: reseed-before-each-independent-trial
    reuseOnExhaustion: false
    allocation: endpoint-weighted-disjoint-ranges
