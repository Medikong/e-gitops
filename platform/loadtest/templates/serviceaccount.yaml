{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dropmong-loadtest.serviceAccountName" . | quote }}
  namespace: {{ include "dropmong-loadtest.namespace" . | quote }}
  annotations:
{{ toYaml .Values.serviceAccount.annotations | nindent 4 }}
  labels:
{{ include "dropmong-loadtest.commonLabels" (dict "root" . "role" "runner") | nindent 4 }}
automountServiceAccountToken: false
{{- with .Values.imagePullSecrets }}
imagePullSecrets:
{{- range . }}
  - name: {{ . | quote }}
{{- end }}
{{- end }}
{{- end }}
