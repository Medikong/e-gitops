apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: medikong-aws-dev
  namespace: istio-system
  labels:
    app.kubernetes.io/part-of: medikong
    medikong.io/environment: aws-dev
spec:
  hosts:
    - "*"
  gateways:
    - medikong-internal
  http:
    - name: auth-debug
      match:
        - uri:
            prefix: /__debug/auth/status
      route:
        - destination:
            host: auth-service.dropmong-auth.svc.cluster.local
            port:
              number: 8080

    - name: notification-debug
      match:
        - uri:
            prefix: /__debug/notification/status
      route:
        - destination:
            host: notification-service.dropmong-notification.svc.cluster.local
            port:
              number: 8084

    - name: payment-debug
      match:
        - uri:
            prefix: /__debug/payment/status
      route:
        - destination:
            host: payment-service.dropmong-payment.svc.cluster.local
            port:
              number: 8083

    - name: user-self
      match:
        - uri:
            prefix: /api/v1/users/me
      route:
        - destination:
            host: user-service.dropmong-user.svc.cluster.local
            port:
              number: 8080

    - name: user
      match:
        - uri:
            prefix: /api/v1/users
      route:
        - destination:
            host: user-service.dropmong-user.svc.cluster.local
            port:
              number: 8080

    - name: interest-operator
      match:
        - uri:
            prefix: /v1/operator
      route:
        - destination:
            host: interest-service.dropmong-interest.svc.cluster.local
            subset: v1
            port:
              number: 8085
          weight: 100
        - destination:
            host: interest-service.dropmong-interest.svc.cluster.local
            subset: v2
            port:
              number: 8085
          weight: 0

    - name: interest-rankings
      match:
        - uri:
            prefix: /v1/rankings
      route:
        - destination:
            host: interest-service.dropmong-interest.svc.cluster.local
            subset: v1
            port:
              number: 8085
          weight: 100
        - destination:
            host: interest-service.dropmong-interest.svc.cluster.local
            subset: v2
            port:
              number: 8085
          weight: 0

    - name: interest-users
      match:
        - uri:
            prefix: /v1/users
      route:
        - destination:
            host: interest-service.dropmong-interest.svc.cluster.local
            subset: v1
            port:
              number: 8085
          weight: 100
        - destination:
            host: interest-service.dropmong-interest.svc.cluster.local
            subset: v2
            port:
              number: 8085
          weight: 0

    - name: interest-drops
      match:
        - uri:
            prefix: /v1/drops
      route:
        - destination:
            host: interest-service.dropmong-interest.svc.cluster.local
            subset: v1
            port:
              number: 8085
          weight: 100
        - destination:
            host: interest-service.dropmong-interest.svc.cluster.local
            subset: v2
            port:
              number: 8085
          weight: 0

    - name: auth
      match:
        - uri:
            prefix: /auth
      route:
        - destination:
            host: auth-service.dropmong-auth.svc.cluster.local
            port:
              number: 8080

    - name: catalog
      match:
        - uri:
            prefix: /drops
      route:
        - destination:
            host: catalog-service.dropmong-catalog.svc.cluster.local
            port:
              number: 8081

    - name: coupon
      match:
        - uri:
            prefix: /coupons
      route:
        - destination:
            host: coupon-service.dropmong-coupon.svc.cluster.local
            port:
              number: 8080

    - name: notification
      match:
        - uri:
            prefix: /notifications
      route:
        - destination:
            host: notification-service.dropmong-notification.svc.cluster.local
            port:
              number: 8084

    - name: order
      match:
        - uri:
            prefix: /orders
      # 2026-07-26: order-service를 Argo Rollouts로 전환하면서 실제 weight 목록을
      # dropmong-order 네임스페이스의 delegate VirtualService(order-service)로 옮김 —
      # Argo Rollouts의 Istio 연동은 대상 VirtualService가 Rollout과 같은 네임스페이스에
      # 있어야만 찾을 수 있어서(istio-system에 있는 이 root VS는 직접 참조 불가), 위임
      # (delegate)으로 우회. 이 root 항목의 위치(catch-all "web"보다 앞)는 그대로 유지 —
      # 순서를 안 지키면(별도 객체로 완전히 분리하면) dropmong-web catch-all에 먹힘을
      # 라이브 실험으로 확인함. platform/istio/traffic/order/virtualservice-delegate.yaml
      # 참고.
      delegate:
        name: order-service
        namespace: dropmong-order

    - name: payment
      match:
        - uri:
            prefix: /payments
      route:
        # 2026-07-25: R24/R25 PoC(카나리 90/10 vs 블루그린 0/100, 각 6라운드,
        # Deployment-analysis.md) 완료 후 실험 종료 — 정리(revert). 카나리는
        # v2가 경합에서 단 한 번도 못 이겼고(success=0/17) p95 349ms, 블루그린은
        # p95 703ms에 일부 라운드 5xx까지 발생 — 카나리가 피해 노출을 훨씬 좁게
        # 억제한다는 결론. 이 결과로 Istio 가중치 카나리를 payment-service의 실제
        # 배포 전략으로 채택하기로 함(DestinationRule/payment-traffic Application은
        # 유지). 다만 v2=synthetic-regression-20260725-01406eb는 실험용 버그 주입
        # 이미지라 실 트래픽에 노출시키면 안 돼서 100/0으로 되돌림 — 다음 정상
        # 릴리스가 나오면 그때 canary 슬롯에 얹고 order-service와 동일한 승격/
        # 롤백 절차(5.4/5.5절)를 따른다.
        - destination:
            host: payment-service.dropmong-payment.svc.cluster.local
            subset: v1
            port:
              number: 8083
          weight: 100
        - destination:
            host: payment-service.dropmong-payment.svc.cluster.local
            subset: v2
            port:
              number: 8083
          weight: 0

    - name: public-auth-entrypoints
      match:
        - uri:
            exact: /.well-known/jwks.json
        - uri:
            exact: /api/v1/auth/intents
        - uri:
            exact: /api/v1/auth/signins/email
      route:
        - destination:
            host: auth-service.dropmong-auth.svc.cluster.local
            port:
              number: 8080

    - name: auth-registration
      match:
        - method:
            exact: POST
          uri:
            exact: /api/v1/auth/registrations
        - method:
            exact: POST
          uri:
            regex: ^/api/v1/auth/registrations/[^/]+/challenges$
        - method:
            exact: POST
          uri:
            regex: ^/api/v1/auth/registrations/[^/]+/challenges/[^/]+/verify$
        - method:
            exact: POST
          uri:
            regex: ^/api/v1/auth/registrations/[^/]+/complete$
        - method:
            exact: GET
          uri:
            regex: ^/api/v1/auth/registrations/[^/]+$
      route:
        - destination:
            host: auth-service.dropmong-auth.svc.cluster.local
            port:
              number: 8080

    - name: development-auth-bulk-tokens
      match:
        - method:
            exact: POST
          uri:
            exact: /api/v1/dev/auth/test-tokens/bulk
          headers:
            x-dev-access-token:
              regex: ^.+$
      route:
        - destination:
            host: auth-service.dropmong-auth.svc.cluster.local
            port:
              number: 8080

    - name: synthetic-auth-virtual-message
      match:
        - method:
            exact: GET
          uri:
            regex: ^/api/v1/dev/auth/verification-messages/[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          headers:
            x-dev-access-token:
              regex: ^.+$
      route:
        - destination:
            host: auth-service.dropmong-auth.svc.cluster.local
            port:
              number: 8080

    # Catch-all은 반드시 마지막에 둔다.
    - name: web
      match:
        - uri:
            prefix: /
      route:
        - destination:
            host: dropmong-web.dropmong-web.svc.cluster.local
            port:
              number: 80
