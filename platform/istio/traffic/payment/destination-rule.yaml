apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: payment-service
  namespace: dropmong-payment
  labels:
    app.kubernetes.io/name: payment-service
    app.kubernetes.io/part-of: medikong
    medikong.io/traffic-policy: canary
spec:
  host: payment-service.dropmong-payment.svc.cluster.local
  subsets:
    - name: v1
      labels:
        version: v1
    - name: v2
      labels:
        version: v2
