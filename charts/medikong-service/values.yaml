environment: chart-default

app:
  name: sample-service
  namespace: medical-sample
  labels: {}

deployment:
  replicasManaged: true
  replicas: 1
  annotations: {}
  podAnnotations: {}
  podLabels: {}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

canary:
  enabled: false
  nameSuffix: v2
  version: v2
  replicas: 1
  pdb:
    enabled: false
    minAvailable: 1
    selectorLabels: {}
  image:
    tag: ""
  podLabels: {}
  podAnnotations: {}
  resources: {}
  # base container.env에 추가로 얹히는 canary 전용 env var (base엔 영향 없음).
  env: []

# Argo Rollouts로 전환한 서비스 전용(2026-07-26, order-service부터). enabled: true면
# deployment.yaml/deployment-canary.yaml 대신 rollout.yaml이 렌더링됨 — canary 블록은
# 무시된다. 기존 DestinationRule(subset v1/v2)을 그대로 재사용하도록 stableMetadata/
# canaryMetadata로 version 라벨을 주입하는 방식(별도 canary Service 불필요). VirtualService/
# DestinationRule은 반드시 이 서비스와 같은 네임스페이스에 있어야 함(Rollout CRD 제약,
# 다른 네임스페이스 참조가 필요하면 Istio delegate로 우회 — order-service 사례 참고).
rollout:
  enabled: false
  canary:
    stableMetadata:
      version: v1
    canaryMetadata:
      version: v2
    # 켜면 AnalysisTemplate(app.name-canary-analysis)이 렌더링되고, Rollout이 카나리
    # 진행 중 내내(startingStep부터) 그 지표를 백그라운드로 체크한다 — 기준 미달이면
    # failureLimit 넘는 순간 자동 중단/롤백.
    analysis:
      enabled: false
      startingStep: 0
      metrics: []
  trafficRouting:
    virtualService:
      name: ""
      routes: []
    destinationRule:
      name: ""
      canarySubsetName: v2
      stableSubsetName: v1
  steps: []

image:
  registry: ""
  repository: ""
  tag: ""
  digest: ""
  version: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

container:
  name: ""
  port: 8080
  ports: []
  env: []
  apiEnv: []
  envFrom: []
  resources:
    requests:
      cpu: 20m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 15
    periodSeconds: 20

workers: []

database:
  sqlalchemy:
    enabled: true
    poolSize: 35
    maxOverflow: 20
    poolTimeoutSeconds: 15
    poolRecycleSeconds: 1800

observability:
  tracing:
    enabled: false
    otlpEndpoint: ""
    excludedUrls: /health,/healthz,/readyz,/metrics
    pythonFastAPIExcludedUrlsEnabled: true
  profiling:
    enabled: false
    serverAddress: ""
    applicationName: ""
    sampleRate: 100
    spanProfilesEnabled: false
    oncpu: true
    gilOnly: true
    tags: {}
    basicAuthUsername: ""
    basicAuthPassword: ""
    tenantId: ""

podSecurityContext: {}
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

rbac:
  create: true
  rules: []

service:
  type: ClusterIP
  port: 8080
  targetPort: http
  ports: []
  annotations: {}

migration:
  enabled: false
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "-5"
  podAnnotations: {}
  podLabels: {}
  command: []
  args: []
  env: []
  envFrom: []
  backoffLimit: 3
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  resources: {}

ingress:
  enabled: false
  name: ""
  className: kong
  annotations: {}
  objects: []
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix

networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
  ingress: []
  excludeIngressNamespaces: []
  egress: []

pdb:
  enabled: false
  minAvailable: 1
  selectorLabels: {}

hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 60

serviceMonitor:
  enabled: false
  labels: {}
  interval: 30s
  path: /metrics
  port: http
  networkPolicy:
    enabled: true
    namespace: monitoring
    port: null
    extraPorts: []
