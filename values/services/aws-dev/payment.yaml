# 2026-07-25: base(v1)는 배포 파이프라인이 갱신하는 공용 image를 그대로 따라가지
# 않고, R24/R25 PoC(order-service 패턴 재사용, Deployment-analysis.md) 진행 중
# 검증된 버전(v0.2.6, X-Service-Version 헤더 포함)에 고정한다. canary(v2)가 실험
# 대상으로서 base와 구분돼야 하기 때문 — order.yaml에서 겪은 것과 같은 이유.
image:
  digest: "sha256:50a5388d382f7562523c972cd4e753cb115be2ca18c9f824c16ace905dce751c"
  version: "v0.2.6"

deployment:
  replicas: 1
  podLabels:
    version: v1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1

# 2026-07-25: order-service R24/R25 PoC와 동일 패턴을 payment-service에 적용
# (Deployment-analysis.md, 다음 회차). canary(v2)는 experiment/payment-service-
# synthetic-regression 브랜치(main엔 merge 안 함)에서 빌드한 실험 전용 이미지 —
# _locked_known_order()의 행 잠금을 SYNTHETIC_REGRESSION_SKIP_LOCK로 우회하고
# SYNTHETIC_REGRESSION_DELAY_SECONDS로 레이스 윈도우를 넓혀서, 동시 결제 승인/
# 실패 요청이 같은 주문에 중복 결제를 만드는지 실측한다. 정식 태그 시퀀스와
# 섞이지 않도록 semver가 아닌 식별 가능한 태그명(synthetic-regression-*)을 쓰고,
# deploy_tag.sh 파이프라인을 거치지 않고 수동으로 build+push했다.
canary:
  enabled: true
  version: v2
  replicas: 1
  image:
    tag: synthetic-regression-20260725-01406eb
  podLabels:
    sidecar.istio.io/inject: "true"
  env:
    - name: SYNTHETIC_REGRESSION_SKIP_LOCK
      value: "true"
    - name: SYNTHETIC_REGRESSION_DELAY_SECONDS
      value: "0.3"

container:
  resources:
    # TODO(운영 전환 시 재활성화, 2026-07-20 팀 합의): 개발단계엔 스케줄링 유연성
    # 우선으로 CPU request/limit 비활성화. requests.cpu는 실측 기준 100m로 통일.
    # requests:
    #   cpu: 100m
    requests: null
    limits:
      cpu: null
      memory: 768Mi

migration:
  enabled: true
  command:
    - alembic
  env:
    - name: DATABASE_URL
      value: postgresql+psycopg://user:password@payment-db:5432/payment_db
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

database:
  sqlalchemy:
    poolSize: 10
    maxOverflow: 0
    poolTimeoutSeconds: 15
    poolRecycleSeconds: 1800

pdb:
  enabled: false

hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
