# 2026-07-25: base(v1)는 배포 파이프라인이 갱신하는 공용 image를 그대로 따라가지
# 않고, R24/R25 PoC(order-service 패턴 재사용, Deployment-analysis.md) 진행 중
# 검증된 버전(v0.2.6, X-Service-Version 헤더 포함)에 고정한다. canary(v2)가 실험
# 대상으로서 base와 구분돼야 하기 때문 — order.yaml에서 겪은 것과 같은 이유.
image:
  digest: "sha256:50a5388d382f7562523c972cd4e753cb115be2ca18c9f824c16ace905dce751c"
  version: "v0.2.6"

deployment:
  replicas: 1
  podLabels:
    version: v1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1

# 2026-07-25: R24/R25 PoC(카나리 vs 블루그린, Deployment-analysis.md) 완료 후
# 실험용 이미지(synthetic-regression-20260725-01406eb, 결제 중복 생성 회귀 토글
# 포함)를 canary 슬롯에서 내리고 비활성화. Istio 가중치 카나리 자체는 실제
# 배포 전략으로 채택됐고 DestinationRule/payment-traffic Application도 유지함 —
# 다음 정상 릴리스가 나오면 여기 canary.enabled: true + image.tag를 채워서
# 재사용한다(order-service 5.4/5.5절과 동일 승격/롤백 절차).
canary:
  enabled: false

container:
  resources:
    # TODO(운영 전환 시 재활성화, 2026-07-20 팀 합의): 개발단계엔 스케줄링 유연성
    # 우선으로 CPU request/limit 비활성화. requests.cpu는 실측 기준 100m로 통일.
    # requests:
    #   cpu: 100m
    requests: null
    limits:
      cpu: null
      memory: 768Mi

migration:
  enabled: true
  command:
    - alembic
  env:
    - name: DATABASE_URL
      value: postgresql+psycopg://user:password@payment-db:5432/payment_db
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

database:
  sqlalchemy:
    poolSize: 10
    maxOverflow: 0
    poolTimeoutSeconds: 15
    poolRecycleSeconds: 1800

pdb:
  enabled: false

hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
