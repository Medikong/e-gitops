# 2026-07-24: base(v1)는 배포 파이프라인이 갱신하는 공용 image를 그대로 따라가지 않고
# 마지막 검증된 안정 버전에 고정한다. 그래야 canary(v2)가 "다음에 승격할 새 릴리스"로서
# base와 실제로 구분됨 — 안 그러면 deploy:tag가 공용 values/services/order.yaml을 갱신할
# 때마다 v1도 같이 최신 태그로 따라가버려서 카나리가 아무 차이 없는 트래픽 분할이 돼버린다.
# 2026-07-27: Argo Rollouts 실제 승급 시연을 위해 v0.1.6 -> v0.1.8로 갱신. 이 커밋이
# 머지되는 순간 Rollout 컨트롤러가 새 ReplicaSet(v2)을 만들고 steps의 setWeight: 10부터
# 카나리를 시작한다(1단계는 pause: {}로 무기한 대기, kubectl argo-rollouts promote로 수동
# 승격). 시연 성공 확정 시 이 오버라이드를 지우거나 v0.1.8로 재고정한다.
image:
  digest: "sha256:76b351fae31ca99e1caea35e5cf939befe6efdd2283ee4ffd407ac4cbbb32403"
  version: "v0.1.8"

deployment:
  podLabels:
    sidecar.istio.io/inject: "true"
    version: v1
  podAnnotations:
    medikong.io/runtime-recovery: "2026-07-25T15:00:00Z"
    sidecar.istio.io/inject: "true"
    sidecar.istio.io/proxyCPU: 25m
    sidecar.istio.io/proxyMemory: 64Mi
    sidecar.istio.io/proxyCPULimit: 200m
    sidecar.istio.io/proxyMemoryLimit: 256Mi
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1

# 2026-07-26: R24/R25(Deployment-analysis.md 5~9장) 이후 채택한 카나리 전략을, 손으로
# 하던 VirtualService weight 편집 대신 Argo Rollouts로 전환한다(위 canary: 블록은
# rollout.enabled: true에서는 무시되므로 제거). Argo Rollouts의 Istio 연동은 대상
# VirtualService가 Rollout과 같은 네임스페이스에 있어야만 weight를 편집할 수 있어서,
# 기존 공유 VirtualService(medikong-aws-dev, istio-system)를 직접 참조할 수 없었다
# (1차 시도에서 InvalidSpec으로 실제 장애 발생, 즉시 revert함 — 아래 참고). 대신
# platform/istio/traffic/order/virtualservice-delegate.yaml(dropmong-order 네임스페이스)를
# 새로 만들고, 공유 VS의 order 항목은 거기로 delegate만 하도록 바꿨다 — 라우팅
# 우선순위(dropmong-web catch-all보다 먼저 매치)는 root VS 안에서 그대로 유지되므로
# 안전함(라이브 실험으로 검증 완료).
#
# 1단계(10%)는 pause: {}(무기한, 수동 kubectl argo-rollouts promote 필요)로 5.4절의
# "수동 승격 판단"을 유지하고, 이후 단계는 60초 자동 진행으로 Rollouts의 점진적 승급을
# 실증한다.
#
# AnalysisTemplate: kube-prometheus-stack(monitoring 네임스페이스)에 이미 Istio가 자동
# 수집하는 istio_requests_total/istio_request_duration_milliseconds_bucket을 그대로
# 재사용 — destination_version 라벨이 stableMetadata/canaryMetadata가 주입하는 v1/v2와
# 정확히 일치해서 앱 코드 수정 없이 바로 됨(2026-07-26 실측 확인). startingStep: 1부터
# (10% 진입 직후) 백그라운드로 계속 돌면서 v2(카나리)의 에러율/p95를 감시하고,
# failureLimit 넘으면 Rollouts가 자동으로 중단/롤백한다. 트래픽이 거의 없으면 쿼리가
# 빈 결과를 반환할 수 있어서(0으로 나누기), 실제 시연 때는 부하테스트를 병행해야 함.
rollout:
  enabled: true
  canary:
    analysis:
      enabled: true
      startingStep: 1
      metrics:
        - name: canary-error-rate
          interval: 20s
          failureLimit: 3
          successCondition: result[0] >= 0.90
          provider:
            prometheus:
              address: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
              query: |
                sum(rate(istio_requests_total{destination_service_name="order-service",destination_version="v2",response_code!~"5.."}[2m]))
                /
                sum(rate(istio_requests_total{destination_service_name="order-service",destination_version="v2"}[2m]))
        - name: canary-p95-latency-ms
          interval: 20s
          failureLimit: 3
          successCondition: result[0] <= 500
          provider:
            prometheus:
              address: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
              query: |
                histogram_quantile(0.95, sum(rate(istio_request_duration_milliseconds_bucket{destination_service_name="order-service",destination_version="v2"}[2m])) by (le))
  trafficRouting:
    virtualService:
      name: order-service
      routes:
        - order
    destinationRule:
      name: order-service
      canarySubsetName: v2
      stableSubsetName: v1
  steps:
    - setWeight: 10
    - pause: {}
    - setWeight: 30
    - pause:
        duration: 60
    - setWeight: 50
    - pause:
        duration: 60
    - setWeight: 100

container:
  env:
    - name: DATABASE_URL
      value: postgresql+psycopg://user:password@order-db:5432/order_db
    - name: KAFKA_BOOTSTRAP_SERVERS
      value: kafka.dropmong-messaging.svc.cluster.local:9092
    - name: ORDER_EXTRA_PRODUCTS_JSON
      value: >-
        [{"drop_id":"opaque-drop-45faeaea","product_id":"opaque-product-45faeaea","unit_price":50000},{"drop_id":"opaque-drop-45faeaea","product_id":"opaque-product-s06-45faeaea","unit_price":50000},{"drop_id":"opaque-drop-load-20260725","product_id":"opaque-product-load-20260725","unit_price":50000}]
  resources:
    # TODO(운영 전환 시 재활성화, 2026-07-20 팀 합의): 개발단계엔 스케줄링 유연성
    # 우선으로 CPU request/limit 비활성화. requests.cpu는 실측 기준 100m로 통일.
    # requests:
    #   cpu: 100m
    # 2026-07-22: Prometheus 실측 기준 실사용 약 109Mi — 실측치의 약 3배 여유로 재조정.
    # ⚠️ 부하테스트(GOAL.md 9장) 전에 반드시 재검토 — idle 트래픽 기준 값임.
    requests: null
    limits:
      cpu: null
      memory: 384Mi

migration:
  enabled: true
  command:
    - python
    - -m
    - app.migrate
  env:
    - name: DATABASE_URL
      value: postgresql+psycopg://user:password@order-db:5432/order_db
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

database:
  sqlalchemy:
    poolSize: 10
    maxOverflow: 0
    poolTimeoutSeconds: 15
    poolRecycleSeconds: 1800

pdb:
  enabled: false
