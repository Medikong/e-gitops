# 2026-07-24: base(v1)는 배포 파이프라인이 갱신하는 공용 image(현재 v0.1.7)를 그대로
# 따라가지 않고 마지막 검증된 안정 버전(v0.1.6)에 고정한다. 그래야 canary(v2,
# v0.1.7)가 "다음에 승격할 새 릴리스"로서 base와 실제로 구분됨 — 안 그러면 deploy:tag가
# 공용 values/services/order.yaml을 갱신할 때마다 v1도 같이 최신 태그로 따라가버려서
# 카나리가 아무 차이 없는 트래픽 분할이 돼버린다. v1을 v0.1.7로 승격하려면(카나리 성공
# 확정 시) 이 오버라이드를 지우거나 v0.1.7로 갱신한다.
image:
  digest: "sha256:85c601ce6691dcdcd276a04311f9e080d114a0ae4ad00a147b2b076a6a9347d2"
  version: "v0.1.6"

deployment:
  podLabels:
    sidecar.istio.io/inject: "true"
    version: v1
  podAnnotations:
    medikong.io/runtime-recovery: "2026-07-25T15:00:00Z"
    sidecar.istio.io/inject: "true"
    sidecar.istio.io/proxyCPU: 25m
    sidecar.istio.io/proxyMemory: 64Mi
    sidecar.istio.io/proxyCPULimit: 200m
    sidecar.istio.io/proxyMemoryLimit: 256Mi
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1

# 2026-07-26: R24/R25(Deployment-analysis.md 5~9장) 이후 채택한 카나리 전략을, 지금까지
# 손으로 하던 VirtualService weight 편집 대신 Argo Rollouts로 전환한다(위 canary: 블록은
# rollout.enabled: true에서는 무시되므로 제거). 기존 DestinationRule(order-service,
# subset v1/v2)과 VirtualService(medikong-aws-dev, order route)를 그대로 재사용 —
# stableMetadata/canaryMetadata가 version: v1/v2 라벨을 계속 주입해주므로 새 Service를
# 만들 필요가 없다. 1단계(10%)는 pause: {}(무기한, 수동 kubectl argo-rollouts promote
# 필요)로 5.4절의 "수동 승격 판단"을 유지하고, 이후 단계는 60초 자동 진행으로
# Rollouts의 점진적 승급을 실증한다. AnalysisTemplate 연결은 다음 단계에서 추가.
rollout:
  enabled: true
  trafficRouting:
    virtualService:
      name: medikong-aws-dev
      namespace: istio-system
      routes:
        - order
    destinationRule:
      name: order-service
      namespace: dropmong-order
      canarySubsetName: v2
      stableSubsetName: v1
  steps:
    - setWeight: 10
    - pause: {}
    - setWeight: 30
    - pause:
        duration: 60
    - setWeight: 50
    - pause:
        duration: 60
    - setWeight: 100

container:
  env:
    - name: DATABASE_URL
      value: postgresql+psycopg://user:password@order-db:5432/order_db
    - name: KAFKA_BOOTSTRAP_SERVERS
      value: kafka.dropmong-messaging.svc.cluster.local:9092
    - name: ORDER_EXTRA_PRODUCTS_JSON
      value: >-
        [{"drop_id":"opaque-drop-45faeaea","product_id":"opaque-product-45faeaea","unit_price":50000},{"drop_id":"opaque-drop-45faeaea","product_id":"opaque-product-s06-45faeaea","unit_price":50000},{"drop_id":"opaque-drop-load-20260725","product_id":"opaque-product-load-20260725","unit_price":50000}]
  resources:
    # TODO(운영 전환 시 재활성화, 2026-07-20 팀 합의): 개발단계엔 스케줄링 유연성
    # 우선으로 CPU request/limit 비활성화. requests.cpu는 실측 기준 100m로 통일.
    # requests:
    #   cpu: 100m
    # 2026-07-22: Prometheus 실측 기준 실사용 약 109Mi — 실측치의 약 3배 여유로 재조정.
    # ⚠️ 부하테스트(GOAL.md 9장) 전에 반드시 재검토 — idle 트래픽 기준 값임.
    requests: null
    limits:
      cpu: null
      memory: 384Mi

migration:
  enabled: true
  command:
    - python
    - -m
    - app.migrate
  env:
    - name: DATABASE_URL
      value: postgresql+psycopg://user:password@order-db:5432/order_db
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

database:
  sqlalchemy:
    poolSize: 10
    maxOverflow: 0
    poolTimeoutSeconds: 15
    poolRecycleSeconds: 1800

pdb:
  enabled: false
